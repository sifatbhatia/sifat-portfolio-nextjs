<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grad)" />
  <rect width="800" height="600" fill="url(#dots)" />
  <g opacity="0.4">
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <circle cx="400" cy="300" r="100" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  </g>
  <text x="400" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">IN PROGRESS</text>
</svg>
